name = "sparrow-radio-api"
main = "src/index.ts"
compatibility_date = "2026-11-23"

# .graphql files are bundled as plain text
[[rules]]
type = "Text"
globs = ["**/*.graphql"]
fallthrough = true

# The React interface (web/dist) is served by the same Worker; only /graphql runs code first.
[assets]
directory = "./web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/graphql"]

[[d1_databases]]
binding = "DB"
database_name = "sparrow-radio-db"
database_id = "58a47eca-2283-4f35-b6a5-5d917d06ec37"
migrations_dir = "migrations"

[triggers]
crons = ["*/5 * * * *"]

[vars]
# Production default: no header-based dev login. For local work copy .dev.vars.example to .dev.vars.
ALLOW_DEV_AUTH = "false"
ACCOUNT_ISSUER = "https://sparrow-account-api.sparrownet.workers.dev"
