name = "sparrow-radio-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[rules]]
type = "Text"
globs = ["**/*.graphql"]
fallthrough = true

[assets]
directory = "./web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/graphql"]

[[d1_databases]]
binding = "DB"
database_name = "sparrow-radio-db"
database_id = "58a47eca-2283-4f35-b6a5-5d917d06ec37"
migrations_dir = "migrations"

[vars]
ALLOW_DEV_AUTH = "false"
