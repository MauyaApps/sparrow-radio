name = "sparrow-radio-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# .graphql files are bundled as plain text
[[rules]]
type = "Text"
globs = ["**/*.graphql"]
fallthrough = true

# The React interface (web/dist) is served by the same Worker; only /graphql runs code first.
[assets]
directory = "./web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/graphql"]

[[d1_databases]]
binding = "DB"
database_name = "sparrow-radio-db"
# Replace with the real id printed by `wrangler d1 create sparrow-radio-db` before deploying.
# Local development (`--local`) works with this placeholder.
database_id = "00000000-0000-0000-0000-000000000000"
migrations_dir = "migrations"

[vars]
# Production default: no header-based dev login. For local work copy .dev.vars.example to .dev.vars.
ALLOW_DEV_AUTH = "false"
